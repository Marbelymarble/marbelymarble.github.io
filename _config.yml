# Setup
title: Mari Schnabel
url: https://marbelymarble.github.io/
paginate: 1
baseurl: ""
permalink: pretty

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

markdown: kramdown

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts
  - tests

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# ga_analytics: UA-000000-0

# Specify the author for blog posts
author:
  name: Mari Schnabel
  url: https://github.com/marbelymarble
  email: marvfpv@gmail.com

# Custom vars
version: 1.0.0

flickr:
  user_id: "205180906@N06"
  album_id: "72177720336833576"
  api_key: ""

# Navbar page list
nav:
  - title: Writing
    url: /archive

  - title: Photography
    url: /photography/

  - title: About
    url: /about
